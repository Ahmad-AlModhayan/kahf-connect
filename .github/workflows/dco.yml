# DCO check: every non-merge commit in a pull request needs a "Signed-off-by:" trailer.
# A plain shell check, no third-party action. Linux only.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$sha" | git interpret-trailers --parse | grep -Eq '^Signed-off-by: .+ <[^<>[:space:]]+@[^<>[:space:]]+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by line"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Sign off with 'git commit -s' (or 'git rebase --signoff'). See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off."
