# The Kotlin SDK's check. Linux only: macOS and Windows runs happen on
# the maintainers' own machines.
name: kotlin

on:
  pull_request:
    paths:
      - "kotlin/**"
      - "fixtures/**"
      - "catalog/**"
      - ".github/workflows/kotlin.yml"
  push:
    branches: [main]
    paths:
      - "kotlin/**"
      - "fixtures/**"
      - "catalog/**"
      - ".github/workflows/kotlin.yml"

permissions:
  contents: read

concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: kotlin/kahf-connect/build/reports/tests
